<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | TechAlpha</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .cart-container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: #171717; border: 1px solid #222; padding: 20px; border-radius: 16px; margin-bottom: 15px; }
        .cart-item-info h3 { font-size: 1.2rem; margin-bottom: 5px; color: #fff; font-family: 'Outfit', sans-serif; }
        .cart-item-info p { color: #a855f7; font-weight: 600; font-size: 1.1rem; }
        .remove-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .remove-btn:hover { background: #ef4444; color: #fff; }
        .checkout-section { background: #171717; border: 1px solid #222; padding: 30px; border-radius: 24px; margin-top: 30px; text-align: center; }
        .checkout-section h2 { margin-bottom: 20px; font-size: 2rem; color: #fff; font-family: 'Outfit', sans-serif; }
        .checkout-section h2 span { color: #a855f7; }
        .checkout-btn { background: #6366f1; color: white; padding: 15px 40px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%; }
        .checkout-btn:hover { background: #4f46e5; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        .empty-cart { text-align: center; font-size: 1.2rem; color: #888; margin-top: 50px; }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="text-decoration:none; color:white;">TechAlpha</a></h1>
        <a href="/" style="text-decoration: none; color: #ededed; font-weight: 500; border: 1px solid #333; padding: 10px 20px; border-radius: 8px;">← Back to Store</a>
    </header>

    <div class="cart-container">
        <h1 style="margin-bottom: 30px; font-family: 'Outfit', sans-serif;">Your Shopping Cart</h1>
        <div id="cart-items"></div>
        
        <div class="checkout-section" id="checkout-section" style="display: none;">
            <h2>Total: $<span id="total-price">0</span></h2>
            <button class="checkout-btn" onclick="window.location.href='/checkout.html'">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const cartContainer = document.getElementById('cart-items');
        const checkoutSection = document.getElementById('checkout-section');
        const totalPriceEl = document.getElementById('total-price');

        function renderCart() {
            cartContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p class="empty-cart">Your cart is empty. Go back and add some gadgets!</p>';
                checkoutSection.style.display = 'none';
                return;
            }

            cart.forEach((item, index) => {
                total += item.price;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div class="cart-item-info">
                        <h3>${item.name}</h3>
                        <p>$${item.price.toFixed(2)}</p>
                    </div>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                `;
                cartContainer.appendChild(itemDiv);
            });

            totalPriceEl.innerText = total.toFixed(2);
            checkoutSection.style.display = 'block';
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
