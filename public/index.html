<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechAlpha | Premium Gadgets</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1><a href="/" style="text-decoration:none; color:white;">TechAlpha</a></h1>
        </div>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for gadgets...">
            <button onclick="searchProducts()">Search</button>
            <button id="clearBtn" onclick="clearSearch()" style="display:none; background:#ef4444; margin-left:5px; padding:8px 12px;">✕</button>
        </div>

        <nav class="nav-links">
            <a href="/">Home</a>
            
            <a href="/login.html" id="auth-link">Login</a>
                        <a href="/my-orders.html">My Orders</a>
            <a href="/cart.html" class="cart-icon">🛒 Cart <span id="cart-count">0</span></a>
        </nav>
    </header>

    <main>
        <section class="hero-title">
            <h2>Next-Gen Tech.</h2>
            <p>Curated premium gadgets for the modern era.</p>
        </section>

        <div id="product-container" class="product-grid">
            <!-- Products load honge -->
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        const token = localStorage.getItem('token');
        const userName = localStorage.getItem('userName');
        if(token && userName) {
            document.getElementById('auth-link').innerText = `Hi, ${userName.split(' ')[0]}`;
            document.getElementById('auth-link').href = "#";
            document.getElementById('auth-link').onclick = () => {
                if(confirm("Do you want to logout?")) {
                    localStorage.removeItem('token');
                    localStorage.removeItem('userName');
                    window.location.reload();
                }
            };
        }
    </script>
</body>
</html>
